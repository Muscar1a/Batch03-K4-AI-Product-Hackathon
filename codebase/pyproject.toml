[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odysseybot"
version = "0.1.0"
description = "OdysseyBot Exporter-Sidecar Architecture for Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.3.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "networkx>=3.2",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odysseybot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
